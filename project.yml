name: TTBDebugPlus
options:
  bundleIdPrefix: com.tuantruong
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: false
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 10

targets:
  TTBDebugPlus:
    type: application
    platform: macOS
    sources:
      - path: TTBDebugPlus
        excludes:
          - "**/.DS_Store"
          - "Resources/Assets.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuantruong.TTBDebugPlus
        PRODUCT_NAME: DebugKit
        INFOPLIST_FILE: TTBDebugPlus/Info.plist
        CODE_SIGN_ENTITLEMENTS: TTBDebugPlus/TTBDebugPlus.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        # Sandbox OFF: DMG/dev-tool distribution so Live Ports (lsof) and process
        # control work. Not Mac App Store–ready without a privileged helper.
        # Hardened Runtime stays ON (line above) for notarization.
        ENABLE_APP_SANDBOX: false
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TTBDebugPlus/TTBDebugPlus.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CODE_SIGN_ENTITLEMENTS: TTBDebugPlus/TTBDebugPlusRelease.entitlements
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
