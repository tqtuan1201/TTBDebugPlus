/* ============================================
   TTBDebugPlus Dark Theme — Online JSON Editor Clone
   Adapted from classic.online-json.com
   ============================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0F172A;
  color: #F8FAFC;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: text;
  user-select: text;
}

body.maximized-card { overflow: hidden; }

/* ---------- Navbar ---------- */
.navbar {
  display: flex;
  align-items: center;
  height: 38px;
  background: linear-gradient(90deg, #1E293B 0%, #0F172A 100%);
  border-bottom: 1px solid rgba(51,65,85,0.3);
  padding: 0 12px;
  flex-shrink: 0;
}

.navbar .brand {
  font-size: 14px;
  font-weight: 600;
  color: #60A5FA;
  display: flex;
  align-items: center;
  gap: 6px;
}

.navbar .brand i { font-size: 16px; }

.navbar .spacer { flex: 1; }

.navbar .nav-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent;
  color: #94A3B8; cursor: pointer;
  border-radius: 4px;
  font-size: 13px;
  transition: all 0.15s;
}
.navbar .nav-btn:hover {
  background: rgba(59,130,246,0.15);
  color: #F8FAFC;
}

/* ---------- Main Container ---------- */
.main-container {
  display: flex;
  flex: 1;
  height: calc(100vh - 38px);
  padding: 6px;
  gap: 6px;
}

/* ---------- Editor Panels ---------- */
.main-editor {
  flex: 1;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  border-radius: 8px;
  overflow: hidden;
  background: #1E293B;
  border: 1px solid rgba(51,65,85,0.3);
  transition: all 0.2s ease;
}

.main-editor.maximized-card {
  position: fixed !important;
  top: 0; left: 0;
  width: 100% !important;
  height: 100% !important;
  max-width: 100% !important;
  max-height: 100% !important;
  margin: 0 !important;
  border-radius: 0 !important;
  z-index: 1040;
}

/* ---------- Controller Panel ---------- */
#controller {
  display: flex;
  flex-direction: column;
  min-width: 110px;
  max-width: 110px;
  padding: 8px 6px;
  gap: 6px;
  background: #1E293B;
  border-radius: 8px;
  border: 1px solid rgba(51,65,85,0.3);
  overflow-y: auto;
  flex-shrink: 0;
}

#controller .ctrl-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #64748B;
  margin-top: 4px;
}

/* ---------- Controller auto-hide: collapsed by default, expand on hover ---------- */
/* Reclaims horizontal space for the editors; hover reveals full labels + select. */
#controller {
  min-width: 46px;
  max-width: 46px;
  transition: min-width 0.18s ease, max-width 0.18s ease;
}
#controller:hover {
  min-width: 116px;
  max-width: 116px;
}
/* Grip hint shown when collapsed */
#controller::before {
  content: '';
  display: block;
  height: 3px;
  width: 18px;
  margin: 0 auto 4px;
  border-radius: 2px;
  background: rgba(148,163,184,0.3);
  transition: opacity 0.15s;
}
#controller:hover::before { opacity: 0; height: 0; margin: 0; }
/* Labels + indent select hide when collapsed, reappear on hover */
#controller .ctrl-label,
#controller .ctrl-btn span,
#controller .switch-row label,
#controller #indent-select {
  display: none;
}
#controller:hover .ctrl-label,
#controller:hover .ctrl-btn span,
#controller:hover .switch-row label {
  display: block;
}
#controller:hover #indent-select { display: block; }

/* Live switch */
.switch-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 0;
}

.switch-row label {
  font-size: 12px;
  color: #94A3B8;
  cursor: pointer;
}

.toggle-switch {
  position: relative;
  width: 32px; height: 18px;
  -webkit-appearance: none;
  appearance: none;
  background: #334155;
  border-radius: 9px;
  outline: none;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-switch:checked { background: #3B82F6; }
.toggle-switch::before {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: white;
  top: 2px; left: 2px;
  transition: transform 0.2s;
}
.toggle-switch:checked::before { transform: translateX(14px); }

/* Buttons */
.ctrl-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 4px;
  border: none;
  background: rgba(51,65,85,0.3);
  color: #94A3B8;
  border-radius: 6px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 500;
  transition: all 0.15s;
}
.ctrl-btn i { font-size: 14px; }
.ctrl-btn:hover {
  background: rgba(59,130,246,0.15);
  color: #60A5FA;
}
.ctrl-btn:active { transform: scale(0.95); }

.ctrl-btn.primary {
  background: rgba(59,130,246,0.2);
  color: #60A5FA;
}
.ctrl-btn.primary:hover {
  background: rgba(59,130,246,0.35);
}

/* Indent select */
.ctrl-select {
  width: 100%;
  padding: 4px 6px;
  background: rgba(51,65,85,0.3);
  color: #F8FAFC;
  border: 1px solid rgba(51,65,85,0.5);
  border-radius: 4px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
.ctrl-select:focus { border-color: #3B82F6; }

/* Copy direction buttons */
.ctrl-row {
  display: flex;
  gap: 4px;
}
.ctrl-row .ctrl-btn { flex: 1; }

/* ---------- JSONEditor Dark Theme Override ---------- */
.jsoneditor {
  border: none !important;
  background: #0F172A !important;
}

.jsoneditor-outer,
.jsoneditor-text-errors,
.jsoneditor-outer .ace_editor,
.jsoneditor .jsoneditor-text,
div.jsoneditor-outer {
  background: #0F172A !important;
}

.jsoneditor-text-errors tr {
  background: rgba(239,68,68,0.08) !important;
}

.jsoneditor > .jsoneditor-menu {
  display: inline-flex !important;
  background: linear-gradient(90deg, #1a1f36 0%, #1E293B 100%) !important;
  border-bottom: 1px solid rgba(51,65,85,0.3) !important;
  border-radius: 0 !important;
}

.jsoneditor-menu > button,
.jsoneditor-menu > .jsoneditor-modes > button {
  filter: invert(0.7) !important;
}

.jsoneditor-menu > .jsoneditor-modes > button:hover,
.jsoneditor-menu > button:hover {
  filter: invert(0.9) !important;
  background: rgba(59,130,246,0.15) !important;
}

/* Mode switch tabs */
.jsoneditor-mode-switch { order: -1; }

.mode-parent {
  display: flex;
  border: 1px solid rgba(148,163,184,0.3);
  border-radius: 4px;
  margin: 2px 4px;
  overflow: hidden;
}

.mode-switch {
  width: 28px; height: 26px;
  display: flex;
  align-items: center; justify-content: center;
  cursor: pointer;
  color: rgba(148,163,184,0.4);
  font-size: 12px;
  transition: all 0.15s;
}

.mode-switch.active {
  background: rgba(59,130,246,0.3);
  color: #F8FAFC;
}

.mode-switch:not(.active):hover {
  background: rgba(148,163,184,0.1);

/* ---------- Single-Pane (read-only viewers) ---------- */
/* When embedded as a read-only viewer (Network/Console/Template),
   hide the second editor + controller and let the primary pane fill
   the whole surface for maximum space. Toggled via TTBridge.setEditable. */
body.single-pane #controller { display: none !important; }
body.single-pane #jsoneditor-2 { display: none !important; }
body.single-pane #jsoneditor-1 {
  flex: 1 1 100% !important;
  min-width: 0 !important;
  border-radius: 0 !important;
  border: none !important;
}
body.single-pane .main-container {
  padding: 0 !important;
  gap: 0 !important;
}
/* Read-only affordance: dim the editable cursor in code mode */
body.single-pane .ace_cursor { opacity: 0 !important; }

/* ---------- Responsive ---------- */
@media (max-width: 700px) {
  .main-container {
    flex-direction: column;
  }
  #controller {
    flex-direction: row;
    max-width: 100%;
    min-width: auto;
    flex-wrap: wrap;
    justify-content: center;
  }
}
</style>

<body>

<!-- Main Editor Area (no navbar — embedded in app) -->
<div class="main-container" id="main-container" style="height: 100vh;">

  <!-- Left Editor (Code) -->
  <div class="main-editor" id="jsoneditor-1"></div>

  <!-- Controller Panel -->
  <div id="controller">
    <!-- Live sync toggle -->
    <div class="switch-row">
      <input type="checkbox" class="toggle-switch" id="live-switch" checked>
      <label for="live-switch">Live</label>
    </div>

    <!-- Format -->
    <button class="ctrl-btn primary" id="format" title="Format JSON">
      <i class="fas fa-align-left"></i>
      <span>Format</span>
    </button>

    <!-- Indent -->
    <span class="ctrl-label">Indent</span>
    <select class="ctrl-select" id="indent-select">
      <option value="2" selected>2 spaces</option>
      <option value="3">3 spaces</option>
      <option value="4">4 spaces</option>
      <option value="8">8 spaces</option>
      <option value="tab">Tab</option>
    </select>

    <!-- Copy direction -->
    <span class="ctrl-label">Copy</span>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="copy2Left" title="Copy Right → Left">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="ctrl-btn" id="copy2Right" title="Copy Left → Right">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>

    <!-- Compact -->
    <button class="ctrl-btn" id="compact-json" title="Compact/Minify">
      <i class="fas fa-compress-alt"></i>
      <span>Compact</span>
    </button>

    <!-- Validate -->
    <button class="ctrl-btn" id="validate-json" title="Validate JSON">
      <i class="fas fa-check-circle"></i>
      <span>Validate</span>
    </button>

    <!-- Copy -->
    <button class="ctrl-btn" id="copy-json" title="Copy to Clipboard">
      <i class="fas fa-copy"></i>
      <span>Copy</span>
    </button>

    <!-- Search -->
    <button class="ctrl-btn" id="search-json" title="Search (Ctrl+F)">
      <i class="fas fa-search"></i>
      <span>Search</span>
    </button>

    <!-- Font size -->
    <span class="ctrl-label">Font</span>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="decrease-font" title="Smaller">
        <i class="fas fa-minus"></i>
      </button>
      <button class="ctrl-btn" id="increase-font" title="Larger">
        <i class="fas fa-plus"></i>
      </button>
    </div>
  </div>

  <!-- Right Editor (Tree) -->
  <div class="main-editor" id="jsoneditor-2"></div>

</div>

<!-- Local vendor JS -->
<script src="jquery.min.js"></script>
<script src="jsoneditor.min.js"></script>
<script src="sweetalert2.min.js"></script>

<script>
// ============================================
// Online JSON Editor — TTBDebugPlus Embedded
// Cloned from classic.online-json.com/json-editor
// Integrated with TTBridge protocol
// ============================================

(function() {
  'use strict';

  // Payloads larger than this (bytes) skip tree mode for performance.
  var LARGE_JSON_THRESHOLD = 512 * 1024;

  // ── Toast ──
  var Toast = Swal.mixin({
    toast: true,
    position: 'bottom',
    showConfirmButton: false,
    timer: 2500,
    background: '#1E293B',
    color: '#F8FAFC',
  });

  // ── Helper Functions (from main.js) ──
  function updatePreview1() {
    editor1.validate().then(function(value) {
      if (!value.length && live_editing) {
        editor2.setText(JSON.stringify(editor1.get(), null, parseInt(!compactFlag ? $('#indent-select').val() : 0)));
      }
      notifySwift('contentChanged', { source: 'editor1', valid: !value.length });
    });
  }

  function updatePreview2() {
    editor2.validate().then(function(value) {
      if (!value.length && live_editing) {
        editor1.setText(JSON.stringify(editor2.get(), null, parseInt(!compactFlag ? $('#indent-select').val() : 0)));
      }
      notifySwift('contentChanged', { source: 'editor2', valid: !value.length });
    });
  }

  function showValidationToast(err, showSuccess) {
    showSuccess = showSuccess || 0;
    if (!err.length) {
      if (showSuccess) {
        Toast.fire({ icon: 'success', title: '&ensp; JSON is valid' });
      }
    } else {
      showValidationError();
    }
  }

  function showValidationError() {
    Toast.fire({ icon: 'error', title: '&ensp; JSON has errors' });
  }

  function updateValidPreview(value, indentFlag) {
    if (indentFlag === undefined) indentFlag = true;
    if (!value.length) {
      var jsonContent = editor1.get();
      compactFlag = !indentFlag;
      editor2.setText(JSON.stringify(jsonContent, null, parseInt(indentFlag ? $('#indent-select').val() : "0")));
    } else {
      showValidationToast(value);
    }
  }

  function addMenus(mode, editorId) {
    var codeActive = '', treeActive = '', previewActive = '';
    if (mode === "code") codeActive = 'active';
    else if (mode === "tree") treeActive = 'active';
    else previewActive = 'active';

    $('#' + editorId + ' .jsoneditor-mode-switch').children().remove();
    $('#' + editorId + ' .jsoneditor-mode-switch').append(
      '<div class="d-flex mode-parent">' +
      '<div class="mode-switch mode-code ' + codeActive + '" title="Code"><i class="fas fa-code"></i></div>' +
      '<div class="mode-switch mode-tree ' + treeActive + '" title="Tree"><i class="fas fa-list"></i></div>' +
      '<div class="mode-switch mode-preview ' + previewActive + '" title="Preview"><i class="fas fa-file-alt"></i></div>' +
      '</div>'
    );

    // Right-side menu buttons
    var menuRight = $('#' + editorId + ' .jsoneditor-menu-right');
    menuRight.children().remove();
    menuRight.append('<i class="btn-menuright btn-menuright-open fas fa-folder-open" title="Open File"></i>');
    menuRight.append('<i class="btn-menuright btn-menuright-expand fas fa-expand" title="Maximize"></i>');
    menuRight.append('<i class="btn-menuright btn-menuright-search fas fa-search" title="Search"></i>');
    menuRight.append('<i class="btn-menuright btn-menuright-download fas fa-download" title="Download"></i>');
    menuRight.append('<i class="btn-menuright btn-menuright-copy fas fa-copy" title="Copy"></i>');

    var previewMenuRight = $('#' + editorId + ' .jsoneditor-preview-menu-right');
    previewMenuRight.children().remove();
    previewMenuRight.append('<i class="btn-menuright btn-menuright-expand fas fa-expand" title="Maximize"></i>');
    previewMenuRight.append('<i class="btn-menuright btn-menuright-download fas fa-download" title="Download"></i>');
    previewMenuRight.append('<i class="btn-menuright btn-menuright-copy fas fa-copy" title="Copy"></i>');
  }

  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement("textarea");
      document.body.appendChild(ta);
      ta.value = text;
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
  }

  function download(content, filename, contentType) {
    if (!contentType) contentType = 'application/octet-stream';
    var a = document.createElement('a');
    var blob = new Blob([content], { type: contentType });
    a.href = window.URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  function dispFile(contents) {
    activeEditor.setText(contents);
    activeEditor.validate().then(function(value) {});
  }

  function openFile(func) {
    var fileInput = document.createElement("input");
    fileInput.type = 'file';
    fileInput.accept = '.json,.txt';
    fileInput.style.display = 'none';
    fileInput.onchange = function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        func(ev.target.result);
        document.body.removeChild(fileInput);
      };
      reader.readAsText(file);
    };
    document.body.appendChild(fileInput);
    fileInput.click();
  }

  // ── Create Editors ──
  var editor1_mode = 'code';
  var editor2_mode = 'tree';

  var container1 = document.getElementById("jsoneditor-1");
  var options1 = {
    mode: editor1_mode,
    onChange: updatePreview1,
    mainMenuBar: true,
    navigationBar: true,
    statusBar: true,
    search: true,
  };
  var editor1 = new JSONEditor(container1, options1);

  var container2 = document.getElementById("jsoneditor-2");
  var options2 = {
    mode: editor2_mode,
    onChange: updatePreview2,
    mainMenuBar: true,
    navigationBar: true,
    statusBar: true,
    search: true,
  };
  var editor2 = new JSONEditor(container2, options2);

  // Initial JSON
  var initialJson = {
    "Array": [1, 2, 3],
    "Boolean": true,
    "Null": null,
    "Number": 123,
    "Object": {"a": "b", "c": "d"},
    "String": "Hello World"
  };

  editor1.set(initialJson);
  editor2.set(initialJson);

  // Editor settings
  var fontSize = 14, indent = 2, compactFlag = false;
  var live_editing = true, activeEditor;

  $('.ace_editor').css('font-size', fontSize + 'px');
  $('.jsoneditor-preview').css('font-size', fontSize + 'px');

  addMenus(editor1_mode, 'jsoneditor-1');
  addMenus(editor2_mode, 'jsoneditor-2');

  // ── Event Handlers ──

  // Mode switching
  $(document).on('click', '.mode-switch', function(e) {
    var editor_id = $(this).parents('.main-editor').attr('id');
    var editor = (editor_id == 'jsoneditor-1') ? editor1 : editor2;
    var mode;
    if ($(this).hasClass('mode-code')) mode = 'code';
    else if ($(this).hasClass('mode-tree')) mode = 'tree';
    else mode = 'preview';
    editor.setMode(mode);
    addMenus(mode, editor_id);
    $(this).parent('.mode-parent').find('.active').removeClass('active');
    $(this).addClass('active');
  });

  // Live sync switch
  $('#live-switch').change(function() {
    live_editing = $(this).prop('checked');
  });

  // Format
  $('#format').click(function(e) {
    editor1.validate().then(function(value) {
      updateValidPreview(value);
    });
  });

  // Indent change
  $('#indent-select').change(function(e) {
    editor1.validate().then(function(value) {
      updateValidPreview(value);
    });
  });

  // Font size
  function applyFontSize() {
    var fs = fontSize + 'px';
    // Code editor
    $('.ace_editor').css('font-size', fs);
    // Preview mode
    $('.jsoneditor-preview').css('font-size', fs);
    // Tree mode — all cells, fields, values, separators
    $('div.jsoneditor td').css('font-size', fs);
    $('div.jsoneditor-field').css('font-size', fs);
    $('div.jsoneditor-value').css('font-size', fs);
    $('div.jsoneditor-readonly').css('font-size', fs);
    $('div.jsoneditor-separator').css('font-size', fs);
    $('div.jsoneditor textarea').css('font-size', fs);
    $('div.jsoneditor th').css('font-size', fs);
    // Navigation bar, status bar
    $('.jsoneditor-navigation-bar').css('font-size', fs);
    $('.jsoneditor-statusbar').css('font-size', Math.max(10, fontSize - 2) + 'px');
    // Tree values table
    $('table.jsoneditor-values').css('font-size', fs);
    // Resize ace editors to recalculate layout
    if (editor1.aceEditor) editor1.aceEditor.resize();
    if (editor2.aceEditor) editor2.aceEditor.resize();
  }

  $('#increase-font').click(function() {
    if (fontSize < 28) fontSize += 1;
    applyFontSize();
  });
  $('#decrease-font').click(function() {
    if (fontSize > 8) fontSize -= 1;
    applyFontSize();
  });

  // Copy between editors
  $('#copy2Left').click(function() {
    editor1.set(editor2.get());
  });
  $('#copy2Right').click(function() {
    editor1.validate().then(function(value) {
      updateValidPreview(value);
    });
  });

  // Compact
  $('#compact-json').click(function() {
    editor1.validate().then(function(value) {
      updateValidPreview(value, false);
    });
  });

  // Validate
  $('#validate-json').click(function() {
    editor1.validate().then(function(value) {
      showValidationToast(value, 1);
    });
  });

  // Copy
  $('#copy-json').click(function() {
    editor2.validate().then(function(value) {
      if (!value.length) {
        copyToClipboard(editor2.getText());
        Toast.fire({ icon: 'success', title: '&ensp; Copied to Clipboard' });
      } else {
        showValidationError();
      }
    });
  });

  // Search — trigger Ace's built-in find dialog
  $('#search-json').click(function() {
    if (editor1.aceEditor) {
      editor1.aceEditor.execCommand('find');
    }
  });

  // Menu button — Copy
  $(document).on('click', '.btn-menuright-copy', function(e) {
    var editor = ($(this).parents('.main-editor').attr('id') == 'jsoneditor-1') ? editor1 : editor2;
    editor.validate().then(function(value) {
      if (!value.length) {
        copyToClipboard(editor.getText());
        Toast.fire({ icon: 'success', title: '&ensp; Copied to Clipboard' });
      } else {
        showValidationError();
      }
    });
  });

  // Menu button — Search
  $(document).on('click', '.btn-menuright-search', function(e) {
    var editor = ($(this).parents('.main-editor').attr('id') == 'jsoneditor-1') ? editor1 : editor2;
    if (editor.aceEditor) editor.aceEditor.execCommand("find");
  });

  // Menu button — Download
  $(document).on('click', '.btn-menuright-download', function(e) {
    var editor = ($(this).parents('.main-editor').attr('id') == 'jsoneditor-1') ? editor1 : editor2;
    editor.validate().then(function(value) {
      if (!value.length) {
        download(editor.getText(), 'data.json', 'application/json');
        Toast.fire({ icon: 'success', title: '&ensp; Downloaded' });
      } else {
        showValidationError();
      }
    });
  });

  // Menu button — Open file
  $(document).on('click', '.btn-menuright-open', function(e) {
    activeEditor = ($(this).parents('.main-editor').attr('id') == 'jsoneditor-1') ? editor1 : editor2;
    openFile(dispFile);
  });

  // Menu button — Expand/Compress per editor
  $(document).on('click', '.btn-menuright-expand', function(e) {
    $(this).parents('.main-editor').addClass("maximized-card");
    $('html').addClass("maximized-card");
    $(this).removeClass('btn-menuright-expand').addClass('btn-menuright-compress');
    $(this).removeClass('fa-expand').addClass('fa-compress');
  });

  $(document).on('click', '.btn-menuright-compress', function(e) {
    $(this).parents('.main-editor').removeClass("maximized-card");
    $('html').removeClass("maximized-card");
    $(this).addClass('btn-menuright-expand').removeClass('btn-menuright-compress');
    $(this).addClass('fa-expand').removeClass('fa-compress');
  });

  // Fullscreen toggle (navbar)
  $('#main-expand-btn').click(function() {
    var container = document.getElementById('main-container');
    var nav = document.querySelector('.navbar');
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function() {});
      nav.style.display = 'none';
      container.style.height = '100vh';
    } else {
      document.exitFullscreen();
      nav.style.display = 'flex';
      container.style.height = 'calc(100vh - 38px)';
    }
  });

  // ── TTBridge Protocol (Swift ↔ JS) ──
  function decodeBase64UTF8(base64) {
    var binary = atob(base64);
    if (window.TextDecoder) {
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder('utf-8').decode(bytes);
    }
    return decodeURIComponent(Array.prototype.map.call(binary, function(ch) {
      return '%' + ('00' + ch.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  }

  function encodeBase64UTF8(text) {
    if (window.TextEncoder) {
      var bytes = new TextEncoder().encode(text);
      var binary = '';
      for (var i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }
    return btoa(unescape(encodeURIComponent(text)));
  }

  window.TTBridge = {
    setContent: function(jsonStr, encodeType) {
      try {
        if (encodeType === 'base64') {
          jsonStr = decodeBase64UTF8(jsonStr);
        }
        var parsed = JSON.parse(jsonStr);
        // Large-payload guard: tree mode builds a DOM node per value and is
        // slow for 10k+ entries. Route big docs to jsoneditor's fast,
        // virtualized 'preview' mode instead.
        var big = jsonStr.length > LARGE_JSON_THRESHOLD;
        editor1.set(parsed);
        if (big && editor1.getMode() === 'tree') {
          editor1.setMode('preview'); addMenus('preview', 'jsoneditor-1');
        }
        editor2.set(parsed);
        if (big && editor2.getMode() === 'tree') {
          editor2.setMode('preview'); addMenus('preview', 'jsoneditor-2');
        }
        notifySwift('contentLoaded', { size: jsonStr.length, valid: true, large: big });
      } catch(e) {
        // If not valid JSON, set as text
        editor1.setText(jsonStr);
        notifySwift('contentLoaded', { size: jsonStr.length, valid: false });
      }
    },

    getContent: function() {
      try {
        return JSON.stringify(editor1.get(), null, parseInt($('#indent-select').val()));
      } catch(e) {
        return editor1.getText();
      }
    },

    getContentBase64: function() {
      return encodeBase64UTF8(this.getContent());
    },

    setMode: function(mode) {
      if (['code', 'tree', 'preview'].includes(mode)) {
        editor1.setMode(mode);
        addMenus(mode, 'jsoneditor-1');
        // Re-apply read-only — switching to code mode recreates the Ace editor.
        if (document.body.classList.contains('single-pane') && editor1.aceEditor) {
          try { editor1.aceEditor.setReadOnly(true); } catch (e) {}
        }
        notifySwift('modeChanged', { mode: mode });
      }
    },

    setEditable: function(editable) {
      // Read-only viewers (editable === false) collapse to a single pane
      // and disable the code-mode cursor/typing for a clean, spacious view.
      var readOnly = (editable === false);
      try {
        if (readOnly) {
          document.body.classList.add('single-pane');
        } else {
          document.body.classList.remove('single-pane');
        }
        if (editor1 && editor1.aceEditor) {
          editor1.aceEditor.setReadOnly(readOnly);
        }
      } catch (e) {
        console.log('[TTBridge] setEditable failed:', e);
      }
    },

    search: function(term) {
      // Trigger Ace's search if in code mode
      if (editor1.aceEditor) {
        editor1.aceEditor.find(term);
      }
    },

    searchNext: function() {
      if (editor1.aceEditor) editor1.aceEditor.findNext();
    },

    searchPrevious: function() {
      if (editor1.aceEditor) editor1.aceEditor.findPrevious();
    },

    format: function() {
      editor1.validate().then(function(value) {
        updateValidPreview(value);
      });
      notifySwift('formatted', {});
    },

    minify: function() {
      editor1.validate().then(function(value) {
        updateValidPreview(value, false);
      });
      notifySwift('minified', {});
    },

    expandAll: function() {
      if (editor2.getMode() === 'tree') {
        editor2.expandAll();
      }
    },

    collapseAll: function() {
      if (editor2.getMode() === 'tree') {
        editor2.collapseAll();
      }
    },

    collapseLevel: function(level) {
      // JSONEditor doesn't have native collapse-by-level
    },

    setTheme: function(theme) {
      // Already dark
    },

    ping: function() {
      notifySwift('pong', {});
    }
  };

  // Bridge: JS → Swift
  function notifySwift(event, data) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jsonBridge) {
        window.webkit.messageHandlers.jsonBridge.postMessage(
          JSON.stringify({ event: event, data: data })
        );
      }
    } catch(e) {
      console.log('[TTBridge] Send failed:', e);
    }
  }

  // Notify ready
  notifySwift('ready', { version: '2.0.0-online-json' });

})();
</script>
